[project]
name = "ekcode"
version = "1.0.0"
description = "EkCode: AI-driven National Unified Material Master for Indian CPSEs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2",
  "pgvector>=0.3", "pydantic-settings>=2.4", "pyjwt>=2.9", "argon2-cffi>=23.1",
  "python-multipart>=0.0.9", "pandas>=2.2", "openpyxl>=3.1", "xlrd>=2.0", "rapidfuzz>=3.9",
  "sentence-transformers>=3.0", "lightgbm>=4.5", "scikit-learn>=1.5", "joblib>=1.4",
  "pyyaml>=6.0", "httpx>=0.27", "redis>=5.0", "rq>=1.16", "pdfplumber>=0.11", "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ekml*"]

# Ship the seed dictionaries with the package, not only in editable installs.
[tool.setuptools.package-data]
ekml = ["dictionaries/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
