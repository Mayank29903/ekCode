name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: ekcode, POSTGRES_PASSWORD: ekcode, POSTGRES_DB: ekcode }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ekcode" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ekcode:ekcode@localhost:5432/ekcode
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-test-secret-0123456789abcdef0123456789abcdef0123456789
      ADMIN_EMAIL: admin@ekcode.local
      ADMIN_PASSWORD: ChangeMe@2026
      DATA_DIR: /tmp/ekdata
      LLM_PROVIDER: noop
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m app.init_db
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run build
