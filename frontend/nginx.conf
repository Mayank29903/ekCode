# Content-Security-Policy for the app. API responses (/api/, including the Swagger docs page) get none:
# add_header skips a header whose value is empty.
# style-src needs 'unsafe-inline' because some UI libraries inject <style> tags at runtime.
map $uri $ek_csp {
  ~^/api/  "";
  default  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # SAP material exports are often several MB; nginx's default limit is 1 MB.
  client_max_body_size 100m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Content-Security-Policy $ek_csp always;

  # Docker's embedded DNS. Resolving "api" per request survives API container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;            # needed for SSE
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Vite puts content-hashed files in /assets, so they can be cached forever.
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  # Not content-hashed: cache briefly.
  location = /theme-init.js {
    expires 1h;
  }

  location = /index.html {
    expires -1;
  }

  location / { try_files $uri /index.html; }
}
